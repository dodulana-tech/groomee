services:
  - type: web
    name: groomee
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run sync:roles && npm run build && cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
    startCommand: node .next/standalone/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: groomee-db
          property: connectionString
      - key: CRON_SECRET
        generateValue: true
      - key: JWT_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: ADMIN_PHONES
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: NEXT_PUBLIC_GROOMEE_WHATSAPP
        value: "2348084296023"
      - key: ANTHROPIC_API_KEY
        sync: false
      # Social listening sources — each connector stays off until set.
      - key: GOOGLE_ALERTS_FEEDS
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: IG_USER_ID
        sync: false
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: X_BEARER_TOKEN
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  - type: cron
    name: groomee-tick
    runtime: node
    schedule: "*/10 * * * *"
    buildCommand: echo "no build needed"
    startCommand: |
      curl -s -H "Authorization: Bearer $CRON_SECRET" "$RENDER_EXTERNAL_URL/api/cron/tick"
    envVars:
      - key: CRON_SECRET
        fromService:
          name: groomee
          type: web
          envVarKey: CRON_SECRET
      - key: RENDER_EXTERNAL_URL
        fromService:
          name: groomee
          type: web
          property: url

  - type: cron
    name: groomee-renew-subs
    runtime: node
    schedule: "0 6 * * *"
    buildCommand: echo "no build needed"
    startCommand: |
      curl -s -H "Authorization: Bearer $CRON_SECRET" "$RENDER_EXTERNAL_URL/api/cron/renew-subscriptions"
    envVars:
      - key: CRON_SECRET
        fromService:
          name: groomee
          type: web
          envVarKey: CRON_SECRET
      - key: RENDER_EXTERNAL_URL
        fromService:
          name: groomee
          type: web
          property: url

  # Benefits debit cron — runs daily at 02:00 UTC. The runner is idempotent
  # per (enrolment, period) so daily firing produces at most one debit per
  # month; daily runs power grace-period nudges and PAUSED → CANCELLED
  # transitions.
  - type: cron
    name: groomee-benefits
    runtime: node
    schedule: "0 2 * * *"
    buildCommand: echo "no build needed"
    startCommand: |
      curl -s -H "Authorization: Bearer $CRON_SECRET" "$RENDER_EXTERNAL_URL/api/cron/benefits"
    envVars:
      - key: CRON_SECRET
        fromService:
          name: groomee
          type: web
          envVarKey: CRON_SECRET
      - key: RENDER_EXTERNAL_URL
        fromService:
          name: groomee
          type: web
          property: url

  # Weekly admin report — Mondays 06:00 UTC (07:00 WAT). Emails ADMIN_EMAILS,
  # WhatsApps ADMIN_PHONES with last-7-days vs prior-7-days.
  - type: cron
    name: groomee-weekly-report
    runtime: node
    schedule: "0 6 * * 1"
    buildCommand: echo "no build needed"
    startCommand: |
      curl -s -H "Authorization: Bearer $CRON_SECRET" "$RENDER_EXTERNAL_URL/api/cron/weekly-report"
    envVars:
      - key: CRON_SECRET
        fromService:
          name: groomee
          type: web
          envVarKey: CRON_SECRET
      - key: RENDER_EXTERNAL_URL
        fromService:
          name: groomee
          type: web
          property: url

  # Social listening — hourly. Connectors self-throttle (Brave daily, X every
  # 6h, Instagram hourly); classifies new posts with Claude and WhatsApps
  # admins about urgent ones.
  - type: cron
    name: groomee-listening
    runtime: node
    schedule: "20 * * * *"
    buildCommand: echo "no build needed"
    startCommand: |
      curl -s -H "Authorization: Bearer $CRON_SECRET" "$RENDER_EXTERNAL_URL/api/cron/listening"
    envVars:
      - key: CRON_SECRET
        fromService:
          name: groomee
          type: web
          envVarKey: CRON_SECRET
      - key: RENDER_EXTERNAL_URL
        fromService:
          name: groomee
          type: web
          property: url

databases:
  - name: groomee-db
    plan: starter
    databaseName: groomee
